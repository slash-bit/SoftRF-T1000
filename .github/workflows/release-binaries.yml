name: Copy release assets to Binaries

# When a release is published (or edited), download every asset attached
# to it and commit them into the Binaries/ folder on main.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to copy (e.g. VB008-z12)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-binaries
  cancel-in-progress: false

jobs:
  copy-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release assets into Binaries/
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p Binaries
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir Binaries --clobber
          ls -l Binaries

      # version.json: same format the SkySignal app reads for firmware updates.
      # Tag VB008-z12 -> versionName "SoftRF-VB008-z12", versionCode 812
      # (major*100 + subversion number, matches 8.0.12 reported by the device).
      # Notes = the bold headings of the release notes, joined with "; ".
      - name: Update Binaries/version.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^VB0*([0-9]+)-[a-z]+([0-9]+)$ ]]; then
            echo "Tag $TAG is not in VBnnn-xNN form, version.json left unchanged"
            exit 0
          fi
          major=${BASH_REMATCH[1]}
          sub=${BASH_REMATCH[2]}
          code=$(( major * 100 + 10#$sub ))
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          notes=$(printf '%s\n' "$body" | grep -oP '^\s*-\s*\*\*\K[^*]+(?=\*\*)' | sed 's/[:.]\s*$//' | paste -sd ';' | sed 's/;/; /g')
          [ -z "$notes" ] && notes="$TAG"
          url="https://github.com/$GITHUB_REPOSITORY/raw/main/Binaries/SoftRF.ino.zip"
          jq -n --argjson code "$code" --arg name "SoftRF-$TAG" --arg url "$url" --arg notes "$notes" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, notes: $notes}' > Binaries/version.json
          cat Binaries/version.json

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Binaries
          if git diff --cached --quiet; then
            echo "Binaries already up to date for $TAG"
            exit 0
          fi
          git commit -m "Binaries: add release assets from $TAG"
          git push origin HEAD:main
